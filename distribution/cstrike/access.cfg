// Accessibilité : NVDA + repères sonores procéduraux. Chargé via userconfig.cfg.
// --- Parole ---
access_speech 1            // annonces vocales
access_speech_hud 1        // santé, armure, argent, arme, zones
access_speech_chat 1       // chat et radio
access_speech_kills 1      // tous les frags (les vôtres sont toujours annoncés)
access_speech_hints 1      // textes d'aide du jeu et du serveur
access_speech_aimtarget 1  // nom du joueur visé (ami/ennemi, santé)
access_speech_timer 1      // 1 minute, 30 et 10 secondes restantes
access_textmenus 1         // menus texte lus par NVDA au lieu des menus graphiques
// --- Sons ---
access_cues 1              // tous les repères sonores
access_cue_volume 0.8
access_sonar 1             // murs proches : 0 off, 1 en mouvement, 2 toujours
access_sonar_range 128     // portée du sonar (unités, 128 = 3 m)
access_ledges 1            // vides et obstacles franchissables
access_enemies 1           // ennemis en ligne de vue
access_enemy_fov 360       // 360 = tout autour ; 120 = seulement devant
access_teammates 1         // coéquipiers proches
access_aimcue 1            // aide à la visée sonore
access_aim_cone 30         // angle (degrés) où le bip de visée commence
access_grenades 1
access_compass_tick 1      // tic en passant par le nord
access_heartbeat 1         // battements de cœur sous 25 de santé
// --- Touches ---
bind "F3" "access_scores"
bind "F4" "access_time"
bind "F6" "access_status"
bind "F7" "access_repeat"
bind "F8" "access_silence"
bind "F9" "access_target_next"
bind "F10" "access_target_prev"
bind "F11" "access_where"
bind "F12" "access_target_stop"
bind "h" "access_scan"
bind "j" "access_enemies_list"
bind "i" "access_compass"
bind "o" "access_motd"
// --- Menus ---
access_menu_mouse 0        // 0 : la souris ne déplace jamais le focus des menus (clavier seul)
// Langue du jeu et des menus (fichiers français inclus) :
ui_language "french"
// Touches du jeu : positions physiques du clavier QWERTY.
// Sur AZERTY : avancer Z, gauche Q, reculer S, droite D ; radio 1/2/3 = W X C.
